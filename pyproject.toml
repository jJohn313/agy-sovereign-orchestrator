[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-sovereign-orchestrator"
version = "2.0.0"
description = "Production Sovereign System-1 Orchestrator with Meta-Tool Escalation for Antigravity (AGY)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "John", email = "john@local" }
]
dependencies = [
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.3.4",
    "mem0ai>=0.1.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.2.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
agy-orchestrator = "orchestrator:main"
agy-daemon = "daemon:main"
