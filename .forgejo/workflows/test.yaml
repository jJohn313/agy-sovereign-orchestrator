name: Test Suite

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: docker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update && apt-get install -y python3 python3-pip python3-pytest
          if [ -f requirements.txt ]; then
            pip install --break-system-packages -r requirements.txt
          fi

      - name: Run Pytest
        run: |
          pytest tests/
